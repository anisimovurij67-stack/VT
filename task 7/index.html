<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Графический редактор Canvas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- ПАНЕЛЬ ИНСТРУМЕНТОВ -->
        <div class="toolbar">
            <div class="tool">
                <label for="colorPicker">Цвет:</label>
                <input type="color" id="colorPicker" value="#000000">
            </div>

            <div class="tool">
                <label for="thickness">Толщина:</label>
                <input type="range" id="thickness" min="1" max="30" value="3">
                <span class="thickness-value" id="thicknessValue">3</span>
            </div>

            <div class="tool">
                <button class="tool-btn active" data-tool="brush">Кисть</button>
                <button class="tool-btn" data-tool="eraser">Ластик</button>
                <button class="tool-btn" data-tool="rect">Прямоугольник</button>
                <button class="tool-btn" data-tool="circle">Круг</button>
            </div>

            <button class="btn-clear" id="clearBtn">Очистить</button>
            <button class="btn-save" id="saveBtn">Сохранить</button>
        </div>

        <!-- ХОЛСТ -->
        <div class="canvas-wrapper">
            <canvas id="canvas" width="800" height="500"></canvas>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
